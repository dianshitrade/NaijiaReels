components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          description: 5-digit business code, see errors.md
        message:
          type: string
        data: {}
    Tokens:
      type: object
      required:
        - accessToken
        - refreshToken
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
        user:
          type: object
          properties:
            id:
              type: string
            nickname:
              type: string
            guest:
              type: boolean
    Drama:
      type: object
      required:
        - id
        - title
      properties:
        id:
          type: string
        title:
          type: string
        coverUrl:
          type: string
          description: Season 1 cover when available, otherwise the drama-level cover.
        tags:
          type: array
          items:
            type: string
        episodeCount:
          type: integer
          description: Episodes released so far.
        description:
          type: string
        heatCount:
          type: integer
          description: Popularity score (plays + likes + saves, weighted); render as 1.2M.
        watchingCount:
          type: integer
          description: Users who played an episode in the last 10 minutes.
        badge:
          type:
            - string
            - 'null'
          enum:
            - hot
            - new
            - null
          description: Corner badge. new = first episode released < 14 days ago; hot = top 10 by heat.
        status:
          type: string
          enum:
            - completed
            - ongoing
        totalEpisodes:
          type: integer
          description: Planned total episodes (== episodeCount when completed). Drives "Ep 2 / 60".
    Episode:
      type: object
      required:
        - id
        - episodeNo
        - locked
        - free
        - priceCoins
      properties:
        id:
          type: string
        episodeNo:
          type: integer
        title:
          type: string
        durationSec:
          type: integer
        free:
          type: boolean
        locked:
          type: boolean
        priceCoins:
          type: integer
        coverUrl:
          type:
            - string
            - 'null'
          description: Absolute per-episode cover image URL; null when absent.
    SubtitleTrack:
      type: object
      required:
        - lang
        - label
        - url
      properties:
        lang:
          type: string
          description: BCP-47 language code (e.g. en, pcm, yo, ig, ha, fr)
        label:
          type: string
          description: Human-readable label (e.g. Naija Pidgin)
        url:
          type: string
          description: Absolute WebVTT URL
    DramaDetail:
      allOf:
        - $ref: '#/components/schemas/Drama'
        - type: object
          properties:
            seasons:
              type: array
              description: Optional. Seasons of the drama, ascending by seasonNo.
              items:
                $ref: '#/components/schemas/Season'
            episodes:
              type: array
              items:
                $ref: '#/components/schemas/Episode'
            topComment:
              $ref: '#/components/schemas/TopComment'
    Season:
      type: object
      required:
        - seasonNo
      properties:
        seasonNo:
          type: integer
          minimum: 1
        title:
          type:
            - string
            - 'null'
        coverUrl:
          type:
            - string
            - 'null'
          format: uri
          description: Absolute season cover URL, null when the season has no cover yet.
    LockedInfo:
      type: object
      required:
        - priceCoins
        - vipAvailable
        - adAvailable
      properties:
        priceCoins:
          type: integer
        vipAvailable:
          type: boolean
        adAvailable:
          type: boolean
    Wallet:
      type: object
      properties:
        balanceCoins:
          type: integer
        bonusCoins:
          type: integer
        vipUntil:
          type:
            - string
            - 'null'
          format: date-time
    Product:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - coins
            - vip
        title:
          type: string
        amountKobo:
          type: integer
        coins:
          type: integer
        bonusCoins:
          type: integer
        playProductId:
          type: string
    Order:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        channel:
          type: string
          enum:
            - play
            - paystack
        status:
          type: string
          enum:
            - pending
            - paid
            - failed
            - refunded
        amountKobo:
          type: integer
        coins:
          type: integer
        createdAt:
          type: string
          format: date-time
        paystackAuthorizationUrl:
          type:
            - string
            - 'null'
        couponId:
          type:
            - string
            - 'null'
        discountKobo:
          type: integer
          description: Coupon discount applied; amountKobo is the amount actually charged.
    Transaction:
      type: object
      properties:
        id:
          type: string
        deltaCoins:
          type: integer
        balanceAfterCoins:
          type: integer
        reason:
          type: string
        refId:
          type: string
        createdAt:
          type: string
          format: date-time
    Checkin:
      type: object
      properties:
        checkedInToday:
          type: boolean
        streakDays:
          type: integer
        todayRewardCoins:
          type: integer
        calendar:
          type: array
          items:
            type: object
            properties:
              day:
                type: integer
              rewardCoins:
                type: integer
              claimed:
                type: boolean
    Task:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        rewardCoins:
          type: integer
        progress:
          type: integer
        target:
          type: integer
        status:
          type: string
          enum:
            - in_progress
            - claimable
            - claimed
    History:
      type: object
      properties:
        dramaId:
          type: string
        episodeId:
          type: string
        episodeNo:
          type: integer
        positionSec:
          type: integer
        updatedAt:
          type: string
          format: date-time
    TopComment:
      type:
      - object
      - 'null'
      description: Highest-liked comment on the drama; null when none.
      required:
      - text
      - likeCount
      properties:
        text:
          type: string
        likeCount:
          type: integer
          minimum: 0
        userName:
          type:
          - string
          - 'null'
          description: Display name; null for anonymous/guest authors.
    FeedEpisode:
      type: object
      required:
      - id
      - episodeNo
      - durationSec
      - locked
      - free
      - priceCoins
      - hlsUrl
      properties:
        id:
          type: string
        episodeNo:
          type: integer
        coverUrl:
          type:
          - string
          - 'null'
        durationSec:
          type: integer
        free:
          type: boolean
        locked:
          type: boolean
        priceCoins:
          type: integer
        hlsUrl:
          type:
          - string
          - 'null'
          description: Signed master.m3u8 URL, present ONLY when locked=false. Short expiry (10 min, see hlsUrlExpiresAt). When null or expired, call GET /episodes/{id}/play (or unlock).
        hlsUrlExpiresAt:
          type:
          - string
          - 'null'
          format: date-time
        subtitles:
          type: array
          description: Same tracks as /episodes/{id}/play; empty when locked.
          items:
            $ref: '#/components/schemas/SubtitleTrack'
    FeedItem:
      type: object
      required:
      - drama
      - episode
      properties:
        drama:
          $ref: '#/components/schemas/Drama'
        episode:
          $ref: '#/components/schemas/FeedEpisode'
        liked:
          type: boolean
          description: Current user liked this episode (false for guests).
        saved:
          type: boolean
          description: Drama is in the user's saved list.
        likeCount:
          type: integer
    ChartItem:
      allOf:
      - $ref: '#/components/schemas/Drama'
      - type: object
        required:
        - rank
        properties:
          rank:
            type: integer
            minimum: 1
          rankChange:
            type:
            - integer
            - 'null'
            description: Positive = moved up vs previous period; null = new entry.
    ComingSoonDrama:
      allOf:
      - $ref: '#/components/schemas/Drama'
      - type: object
        required:
        - releaseAt
        - reminderSet
        properties:
          releaseAt:
            type: string
            format: date-time
          reminderSet:
            type: boolean
            description: false for guests.
          reminderCount:
            type: integer
            description: Users who set a reminder.
    Reminder:
      type: object
      required:
      - dramaId
      - reminderSet
      properties:
        dramaId:
          type: string
        reminderSet:
          type: boolean
        releaseAt:
          type:
          - string
          - 'null'
          format: date-time
    ShopPackage:
      type: object
      required:
      - id
      - type
      - title
      - amountKobo
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - coins
          - vip
        title:
          type: string
        coins:
          type: integer
          description: Base coins credited (coins packages; 0 for vip). Name kept for frontend/Product compatibility.
        bonusCoins:
          type: integer
        amountKobo:
          type: integer
        originalAmountKobo:
          type:
          - integer
          - 'null'
          description: Strike-through price; null when not discounted.
        tag:
          type:
          - string
          - 'null'
          enum:
          - first_recharge
          - limited
          - null
        endsAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Offer end (limited); null = no countdown.
        vipDays:
          type:
          - integer
          - 'null'
          description: VIP duration; null for coins packages.
        playProductId:
          type:
          - string
          - 'null'
          description: Google Play product id for channel=play.
    Coupon:
      type: object
      required:
      - id
      - title
      - type
      - status
      - expiresAt
      properties:
        id:
          type: string
        title:
          type: string
        type:
          type: string
          enum:
          - amount_off
          - bonus_coins
        amountOffKobo:
          type:
          - integer
          - 'null'
        bonusCoins:
          type:
          - integer
          - 'null'
        minAmountKobo:
          type: integer
          description: Minimum package price to apply.
        packageIds:
          type: array
          items:
            type: string
          description: Applicable packages; empty = all.
        status:
          type: string
          enum:
          - available
          - used
          - expired
        expiresAt:
          type: string
          format: date-time
    RewardDay:
      type: object
      required:
      - day
      - rewardCoins
      - status
      properties:
        day:
          type: integer
          minimum: 1
          maximum: 7
        rewardCoins:
          type: integer
        status:
          type: string
          enum:
          - locked
          - claimable
          - claimed
          - missed
        taskId:
          type:
          - string
          - 'null'
          description: Pass to POST /rewards/{taskId}/claim when claimable.
    RewardTask:
      type: object
      required:
      - taskId
      - title
      - rewardCoins
      - progress
      - target
      - status
      properties:
        taskId:
          type: string
        title:
          type: string
        rewardCoins:
          type: integer
        progress:
          type: integer
        target:
          type: integer
        status:
          type: string
          enum:
          - in_progress
          - claimable
          - claimed
        dramaId:
          type:
          - string
          - 'null'
          description: Set for drama completion tasks.
    Chest:
      type: object
      required:
      - id
      - taskId
      - status
      properties:
        id:
          type: string
        taskId:
          type: string
        status:
          type: string
          enum:
          - locked
          - unlocking
          - claimable
          - claimed
        unlockAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 'Time-based chest: claimable after this.'
        progress:
          type:
          - integer
          - 'null'
        target:
          type:
          - integer
          - 'null'
