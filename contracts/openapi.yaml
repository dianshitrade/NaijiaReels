openapi: 3.1.0
info:
  title: NaijaReels API
  version: 0.1.0
  description: >-
    All responses use {code,message,data}; code=0 means success. Amounts in kobo (integer); coins integer fields end
    with Coins.
  contact:
    name: NaijaReels Backend
servers:
  - url: http://localhost:3000
  - url: http://localhost:4010
    description: Prism mock
tags:
  - name: auth
    description: auth APIs
  - name: content
    description: content APIs
  - name: play
    description: play APIs
  - name: trade
    description: trade APIs
  - name: ops
    description: ops APIs
  - name: webhooks
    description: webhooks APIs
security:
  - bearerAuth: []
paths:
  /api/v1/auth/guest:
    post:
      tags:
        - auth
      operationId: authGuest
      summary: authGuest
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - deviceId
              properties:
                deviceId:
                  type: string
                platform:
                  type: string
                  enum:
                    - android
                    - ios
                    - web
                appVersion:
                  type: string
            example:
              deviceId: a1b2c3d4
              platform: android
              appVersion: 1.0.0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Tokens'
              example:
                code: 0
                message: ok
                data:
                  accessToken: eyJhbGciOiJIUzI1NiJ9.access
                  refreshToken: eyJhbGciOiJIUzI1NiJ9.refresh
                  expiresIn: 7200
                  user:
                    id: u_1
                    nickname: Guest_8f2a
                    guest: true
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 40001
                message: Validation failed
                data: null
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 42901
                message: Too many requests
                data: null
      description: authGuest
  /api/v1/auth/bind:
    post:
      tags:
        - auth
      operationId: authBind
      summary: authBind
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - provider
                - credential
              properties:
                provider:
                  type: string
                  enum:
                    - google
                    - phone
                    - email
                credential:
                  type: string
                code:
                  type: string
            example:
              provider: google
              credential: google-id-token
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Tokens'
              example:
                code: 0
                message: ok
                data:
                  accessToken: eyJhbGciOiJIUzI1NiJ9.access
                  refreshToken: eyJhbGciOiJIUzI1NiJ9.refresh
                  expiresIn: 7200
                  user:
                    id: u_1
                    nickname: Ada
                    guest: false
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 40101
                message: Unauthorized
                data: null
        '409':
          description: Account already bound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 40901
                message: Account already bound
                data: null
      description: authBind
  /api/v1/auth/refresh:
    post:
      tags:
        - auth
      operationId: authRefresh
      summary: authRefresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
            example:
              refreshToken: eyJhbGciOiJIUzI1NiJ9.refresh
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Tokens'
              example:
                code: 0
                message: ok
                data:
                  accessToken: eyJhbGciOiJIUzI1NiJ9.access
                  refreshToken: eyJhbGciOiJIUzI1NiJ9.refresh
                  expiresIn: 7200
                  user:
                    id: u_1
                    nickname: Guest_8f2a
                    guest: true
        '401':
          description: Refresh token invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 40102
                message: Refresh token invalid
                data: null
      description: authRefresh
  /api/v1/home:
    get:
      tags:
        - content
      operationId: getHome
      summary: getHome
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      banners:
                        type: array
                        items:
                          $ref: '#/components/schemas/Drama'
                      sections:
                        type: array
                        items:
                          type: object
                          properties:
                            title:
                              type: string
                            items:
                              type: array
                              items:
                                $ref: '#/components/schemas/Drama'
              example:
                code: 0
                message: ok
                data:
                  banners:
                    - id: dr_1
                      title: Lagos Love Story
                      coverUrl: https://cdn.example.com/c/dr_1.jpg
                      tags:
                        - romance
                      episodeCount: 60
                      description: A Lagos romance.
                  sections:
                    - title: Trending
                      items:
                        - id: dr_1
                          title: Lagos Love Story
                          coverUrl: https://cdn.example.com/c/dr_1.jpg
                          tags:
                            - romance
                          episodeCount: 60
                          description: A Lagos romance.
      description: getHome
  /api/v1/dramas:
    get:
      tags:
        - content
      operationId: listDramas
      summary: listDramas
      security: []
      parameters:
        - name: tag
          in: query
          schema:
            type: string
          example: romance
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - items
                      - page
                      - size
                      - hasMore
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Drama'
                      page:
                        type: integer
                      size:
                        type: integer
                      hasMore:
                        type: boolean
              example:
                code: 0
                message: ok
                data:
                  items:
                    - id: dr_1
                      title: Lagos Love Story
                      coverUrl: https://cdn.example.com/c/dr_1.jpg
                      tags:
                        - romance
                      episodeCount: 60
                      description: A Lagos romance.
                  page: 1
                  size: 20
                  hasMore: false
      description: listDramas
  /api/v1/dramas/{id}:
    get:
      tags:
        - content
      operationId: getDrama
      summary: getDrama
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: dr_1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/DramaDetail'
              example:
                code: 0
                message: ok
                data:
                  id: dr_1
                  title: Lagos Love Story
                  coverUrl: https://cdn.example.com/c/dr_1.jpg
                  tags:
                    - romance
                  episodeCount: 60
                  description: A Lagos romance.
                  episodes:
                    - id: ep_1001
                      episodeNo: 1
                      title: Episode 1
                      durationSec: 90
                      free: true
                      locked: false
                      priceCoins: 0
                    - id: ep_1010
                      episodeNo: 10
                      title: Episode 10
                      durationSec: 95
                      free: false
                      locked: true
                      priceCoins: 30
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 40401
                message: Not found
                data: null
      description: getDrama
  /api/v1/search:
    get:
      tags:
        - content
      operationId: search
      summary: search
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          example: love
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - items
                      - page
                      - size
                      - hasMore
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Drama'
                      page:
                        type: integer
                      size:
                        type: integer
                      hasMore:
                        type: boolean
              example:
                code: 0
                message: ok
                data:
                  items:
                    - id: dr_1
                      title: Lagos Love Story
                      coverUrl: https://cdn.example.com/c/dr_1.jpg
                      tags:
                        - romance
                      episodeCount: 60
                      description: A Lagos romance.
                  page: 1
                  size: 20
                  hasMore: false
      description: search
  /api/v1/episodes/{id}/play:
    get:
      tags:
        - play
      operationId: playEpisode
      summary: playEpisode
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: ep_1001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - hlsUrl
                      - expiresAt
                    properties:
                      hlsUrl:
                        type: string
                      expiresAt:
                        type: string
                        format: date-time
                      coverUrl:
                        type:
                          - string
                          - 'null'
                        description: Absolute per-episode cover image URL; null when absent.
              example:
                code: 0
                message: ok
                data:
                  hlsUrl: https://media.example.com/media/dr_1/1/index.m3u8?sig=abc&exp=1793232000
                  expiresAt: '2026-10-29T02:00:00Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 40101
                message: Unauthorized
                data: null
        '403':
          description: Episode locked
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/LockedInfo'
              example:
                code: 40301
                message: Episode locked
                data:
                  priceCoins: 30
                  vipAvailable: true
                  adAvailable: true
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 40401
                message: Not found
                data: null
      description: playEpisode
  /api/v1/episodes/{id}/unlock:
    post:
      tags:
        - play
      operationId: unlockEpisode
      summary: unlockEpisode
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: ep_1001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - method
              properties:
                method:
                  type: string
                  enum:
                    - coin
                    - ad
                    - vip
                adRewardToken:
                  type: string
                  description: Required when method=ad
            example:
              method: coin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      episodeId:
                        type: string
                      method:
                        type: string
                      balanceCoins:
                        type: integer
              example:
                code: 0
                message: ok
                data:
                  episodeId: ep_1010
                  method: coin
                  balanceCoins: 90
        '400':
          description: adRewardToken required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 40002
                message: adRewardToken required
                data: null
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 40101
                message: Unauthorized
                data: null
        '402':
          description: Insufficient coins
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 40201
                message: Insufficient coins
                data: null
      description: unlockEpisode
  /api/v1/wallet:
    get:
      tags:
        - trade
      operationId: getWallet
      summary: getWallet
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Wallet'
              example:
                code: 0
                message: ok
                data:
                  balanceCoins: 120
                  bonusCoins: 20
                  vipUntil: null
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 40101
                message: Unauthorized
                data: null
      description: getWallet
  /api/v1/products:
    get:
      tags:
        - trade
      operationId: listProducts
      summary: listProducts
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
              example:
                code: 0
                message: ok
                data:
                  - id: p_coins_100
                    type: coins
                    title: 100 Coins
                    amountKobo: 50000
                    coins: 100
                    bonusCoins: 10
                    playProductId: coins_100
      description: listProducts
  /api/v1/orders:
    post:
      tags:
        - trade
      operationId: createOrder
      summary: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - productId
                - channel
              properties:
                productId:
                  type: string
                channel:
                  type: string
                  enum:
                    - play
                    - paystack
            example:
              productId: p_coins_100
              channel: paystack
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Order'
              example:
                code: 0
                message: ok
                data:
                  id: ord_1
                  productId: p_coins_100
                  channel: paystack
                  status: pending
                  amountKobo: 50000
                  coins: 100
                  createdAt: '2026-10-29T00:00:00Z'
                  paystackAuthorizationUrl: https://checkout.paystack.com/abc
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 40101
                message: Unauthorized
                data: null
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 40401
                message: Not found
                data: null
      description: createOrder
    get:
      tags:
        - trade
      operationId: listOrders
      summary: listOrders
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - items
                      - page
                      - size
                      - hasMore
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Order'
                      page:
                        type: integer
                      size:
                        type: integer
                      hasMore:
                        type: boolean
              example:
                code: 0
                message: ok
                data:
                  items:
                    - id: ord_1
                      productId: p_coins_100
                      channel: paystack
                      status: pending
                      amountKobo: 50000
                      coins: 100
                      createdAt: '2026-10-29T00:00:00Z'
                      paystackAuthorizationUrl: https://checkout.paystack.com/abc
                  page: 1
                  size: 20
                  hasMore: false
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 40101
                message: Unauthorized
                data: null
      description: listOrders
  /api/v1/orders/play/verify:
    post:
      tags:
        - trade
      operationId: verifyPlayOrder
      summary: verifyPlayOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - orderId
                - purchaseToken
                - productId
              properties:
                orderId:
                  type: string
                purchaseToken:
                  type: string
                productId:
                  type: string
            example:
              orderId: ord_1
              purchaseToken: play-token
              productId: coins_100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Order'
              example:
                code: 0
                message: ok
                data:
                  id: ord_1
                  productId: p_coins_100
                  channel: play
                  status: paid
                  amountKobo: 50000
                  coins: 100
                  createdAt: '2026-10-29T00:00:00Z'
                  paystackAuthorizationUrl: null
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 40101
                message: Unauthorized
                data: null
        '422':
          description: Purchase verification failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 42201
                message: Purchase verification failed
                data: null
      description: verifyPlayOrder
  /api/v1/orders/{id}:
    get:
      tags:
        - trade
      operationId: getOrder
      summary: getOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: ord_1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Order'
              example:
                code: 0
                message: ok
                data:
                  id: ord_1
                  productId: p_coins_100
                  channel: paystack
                  status: pending
                  amountKobo: 50000
                  coins: 100
                  createdAt: '2026-10-29T00:00:00Z'
                  paystackAuthorizationUrl: https://checkout.paystack.com/abc
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 40101
                message: Unauthorized
                data: null
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 40401
                message: Not found
                data: null
      description: getOrder
  /api/v1/wallet/transactions:
    get:
      tags:
        - trade
      operationId: listTransactions
      summary: listTransactions
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - items
                      - page
                      - size
                      - hasMore
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Transaction'
                      page:
                        type: integer
                      size:
                        type: integer
                      hasMore:
                        type: boolean
              example:
                code: 0
                message: ok
                data:
                  items:
                    - id: tx_1
                      deltaCoins: -30
                      balanceAfterCoins: 90
                      reason: unlock
                      refId: ep_1010
                      createdAt: '2026-10-29T00:00:00Z'
                  page: 1
                  size: 20
                  hasMore: false
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 40101
                message: Unauthorized
                data: null
      description: listTransactions
  /api/v1/checkin:
    get:
      tags:
        - ops
      operationId: getCheckin
      summary: getCheckin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
