        newbie7Day:
          type:
          - object
          - 'null'
          description: null once completed or after 14 days from signup.
          required:
          - days
          properties:
            days:
              type: array
              items:
                $ref: '#/components/schemas/RewardDay'
        checkin7Day:
          type: object
          required:
          - streak
          - todayChecked
          - days
          properties:
            streak:
              type: integer
            todayChecked:
              type: boolean
            days:
              type: array
              items:
                $ref: '#/components/schemas/RewardDay'
        bingeStreak:
