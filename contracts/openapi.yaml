components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          description: 5-digit business code, see errors.md
        message:
          type: string
        data: {}
    Tokens:
      type: object
      required:
        - accessToken
        - refreshToken
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
        user:
          type: object
          properties:
            id:
              type: string
            nickname:
              type: string
            guest:
              type: boolean
    Drama:
      type: object
      required:
        - id
        - title
      properties:
        id:
          type: string
        title:
          type: string
        coverUrl:
          type: string
        tags:
          type: array
          items:
            type: string
        episodeCount:
          type: integer
        description:
          type: string
    Episode:
      type: object
      required:
        - id
        - episodeNo
        - locked
        - free
        - priceCoins
      properties:
        id:
          type: string
        episodeNo:
          type: integer
        title:
          type: string
        durationSec:
          type: integer
        free:
          type: boolean
        locked:
          type: boolean
        priceCoins:
          type: integer
        coverUrl:
          type:
            - string
            - 'null'
          description: Absolute per-episode cover image URL; null when absent.
    DramaDetail:
      allOf:
        - $ref: '#/components/schemas/Drama'
        - type: object
          properties:
            episodes:
              type: array
              items:
                $ref: '#/components/schemas/Episode'
    LockedInfo:
      type: object
      required:
        - priceCoins
        - vipAvailable
        - adAvailable
      properties:
        priceCoins:
          type: integer
        vipAvailable:
          type: boolean
        adAvailable:
          type: boolean
    Wallet:
      type: object
      properties:
        balanceCoins:
          type: integer
        bonusCoins:
          type: integer
        vipUntil:
          type:
            - string
            - 'null'
          format: date-time
    Product:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - coins
            - vip
        title:
          type: string
        amountKobo:
          type: integer
        coins:
          type: integer
        bonusCoins:
          type: integer
        playProductId:
          type: string
    Order:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        channel:
          type: string
          enum:
            - play
            - paystack
        status:
          type: string
          enum:
            - pending
            - paid
            - failed
            - refunded
        amountKobo:
          type: integer
        coins:
          type: integer
        createdAt:
          type: string
          format: date-time
        paystackAuthorizationUrl:
          type:
            - string
            - 'null'
    Transaction:
      type: object
      properties:
        id:
          type: string
        deltaCoins:
          type: integer
        balanceAfterCoins:
          type: integer
        reason:
          type: string
        refId:
          type: string
        createdAt:
          type: string
          format: date-time
    Checkin:
      type: object
      properties:
        checkedInToday:
          type: boolean
        streakDays:
          type: integer
        todayRewardCoins:
          type: integer
        calendar:
          type: array
          items:
            type: object
            properties:
              day:
                type: integer
              rewardCoins:
                type: integer
              claimed:
                type: boolean
    Task:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        rewardCoins:
          type: integer
        progress:
          type: integer
        target:
          type: integer
        status:
          type: string
          enum:
            - in_progress
            - claimable
            - claimed
    History:
      type: object
      properties:
        dramaId:
          type: string
        episodeId:
          type: string
        episodeNo:
          type: integer
        positionSec:
          type: integer
        updatedAt:
          type: string
          format: date-time
