name: app

on:
  push:
    branches: [main, 'feat/app-*']
    paths: ['app/**', '.github/workflows/app.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/app.yml']
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Default API_BASE_URL baked into the APK (e.g. https://xxx.trycloudflare.com)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fill platform scaffolding (no overwrite)
        run: flutter create --platforms android --org com.naijareels --project-name naija_reels .
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
        timeout-minutes: 10
      - run: flutter test
      - name: Build APKs
        env:
          API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL }}
        run: |
          DEFINE=""
          if [ -n "$API_BASE_URL" ]; then DEFINE="--dart-define=API_BASE_URL=$API_BASE_URL"; fi
          echo "API_BASE_URL=${API_BASE_URL:-<default http://10.0.2.2:4010>}"
          flutter build apk --debug --split-per-abi $DEFINE
      - uses: actions/upload-artifact@v4
        with:
          name: naijareels-debug-apks
          path: app/build/app/outputs/flutter-apk/*.apk
