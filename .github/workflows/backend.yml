name: backend

on:
  pull_request:
    paths: ["backend/**", "contracts/**", "docker-compose.yml", "infra/**", ".github/workflows/backend.yml"]
  push:
    branches: [main, "feat/**"]
    paths: ["backend/**", "contracts/**", "docker-compose.yml", "infra/**", ".github/workflows/backend.yml"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: naija, POSTGRES_PASSWORD: naija, POSTGRES_DB: naija }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U naija" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://naija:naija@localhost:5432/naija?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run seed
      - run: npm run lint
      - run: npm test
      - run: npm run build

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npx -y @stoplight/spectral-cli@6 lint contracts/openapi.yaml --ruleset contracts/.spectral.yaml --fail-severity error

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build pg redis backend mock
      - name: health check
        run: |
          for i in $(seq 1 60); do curl -fsS localhost:3000/api/v1/health && break; sleep 2; done
          curl -fsS localhost:3000/api/v1/health
      - name: D2 smoke (seeded data + signed HLS via nginx)
        run: |
          docker compose up -d nginx
          curl -fsS localhost:3000/api/v1/dramas | grep -q 'Mama-in-Law Wahala'
          TOKEN=$(curl -fsS -X POST localhost:3000/api/v1/auth/guest -H 'content-type: application/json' -d '{"deviceId":"ci-smoke-1"}' | jq -r .data.accessToken)
          URL=$(curl -fsS localhost:3000/api/v1/episodes/dr_mama_ep1/play -H "Authorization: Bearer $TOKEN" | jq -r .data.hlsUrl)
          echo "$URL"
          for i in $(seq 1 15); do curl -fsS "$URL" && break; sleep 2; done
          curl -fsS "$URL" | grep -q EXTM3U
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/api/v1/episodes/dr_mama_ep3/play -H "Authorization: Bearer $TOKEN")" = 403
      - name: mock check
        run: |
          for i in $(seq 1 60); do curl -fsS localhost:4010/api/v1/dramas && break; sleep 2; done
          curl -fsS localhost:4010/api/v1/dramas | grep -q '"items"'
      - if: failure()
        run: docker compose logs
