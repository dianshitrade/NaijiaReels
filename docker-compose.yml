services:
  pg:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: naija
      POSTGRES_PASSWORD: naija
      POSTGRES_DB: naija
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naija"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://naija:naija@pg:5432/naija?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-only-jwt-secret-change-me
      MEDIA_BASE_URL: http://localhost:8080/media
      MEDIA_SIGN_SECRET: dev-only-media-secret
    ports: ["3000:3000"]
    depends_on:
      pg: { condition: service_healthy }
      redis: { condition: service_healthy }

  mock:
    image: stoplight/prism:5
    command: mock -h 0.0.0.0 -p 4010 /contracts/openapi.yaml
    volumes: ["./contracts:/contracts:ro"]
    ports: ["4010:4010"]

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/media:/srv/media:ro
    ports: ["8080:80"]
    depends_on: [backend]

volumes:
  pgdata:
